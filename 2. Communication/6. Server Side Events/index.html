<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Side Events</title>
</head>
<body>
    <h1>Server Side Events</h1>
    <button id="close">Close COnnection</button>
    <script>
        // Setup sse connection

        const closeBtn = document.getElementById('close')

        const eventSource = new EventSource("/sse") // this class is given by the browser to connect to the server and listen for events
        eventSource.onmessage = (event) =>{
            console.log(event.data)

        }

        closeBtn.addEventListener('click', ()=>{
            eventSource.close()
        })


    </script>
</body>
</html>
